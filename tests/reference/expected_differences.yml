# Check 3: every known difference between our output and jaffle-shop, with its reason.
# A difference not listed here fails the test ("unexplained"); a listed one that no longer
# differs also fails ("stale"), so this list stays true.
#
# key: columns that identify a row (our names)
# rename: our column -> jaffle-shop column, where the names differ
# boolean_as_int: jaffle-shop uses true/false where the XML uses 1/0
# explained: our column -> why it differs (with XML lines and decisions)
# not_compared: columns with no twin on the other side

staging:
  stg_customers:
    key: [customer_id]

  stg_locations:
    key: [location_id]
    not_compared:
      ours:
        region: "Derived from the tax rate in the XML (L236); jaffle-shop has no region."

  stg_order_items:
    key: [order_item_id]

  stg_orders:
    key: [order_id]
    rename: {ordered_at_day: ordered_at}
    explained:
      subtotal_cents: "Swap at L608: holds dollars, rounded to whole dollars by its NUMBER(15,0) column (decisions D1, Q11)."
      tax_paid_cents: "Swap at L609: holds dollars, rounded to whole dollars by its NUMBER(15,0) column (decisions D1, Q11)."
      order_total_cents: "Swap at L610: holds dollars (decision D1)."
      subtotal: "Swap at L611: holds cents (decision D1)."
      tax_paid: "Swap at L612: holds cents (decision D1)."
      order_total: "Swap at L613: holds cents (decision D1)."

  stg_products:
    key: [product_id]
    boolean_as_int: [is_food_item, is_drink_item]
    explained:
      product_price: "Swap at L621: holds cents, not dollars (decision D1)."
    not_compared:
      ours:
        product_price_cents: "Swap at L620: holds dollars rounded to whole dollars; jaffle-shop has no cents column."

  stg_supplies:
    key: [supply_id, product_id]   # supply_id alone repeats (29 distinct IDs in 65 rows)
    rename: {is_perishable: is_perishable_supply}
    boolean_as_int: [is_perishable]
    explained:
      is_perishable: "The rule at L504 compares text to 'Y' and '1'; loaded with the XML's text type (decision Q14) the seed's True/False never match, so every supply is 0."
    not_compared:
      ours:
        supply_cost_cents: "jaffle-shop has no cents column."
      reference:
        supply_uuid: "jaffle-shop's surrogate key; the XML has none."

marts:
  customers:
    key: [customer_id]
    rename: {lifetime_orders: count_lifetime_orders, first_order_date: first_ordered_at, last_order_date: last_ordered_at}
    explained:
      lifetime_spend: "100 times jaffle-shop's: AGG_ORDERS_BY_CUSTOMER sums ORDER_TOTAL (L3636), which holds cents because of the staging swap at L613 (decision D1)."
      lifetime_spend_pretax: "100 times jaffle-shop's: it sums SUBTOTAL (L3637), which holds cents because of the staging swap at L611 (decision D1)."
      lifetime_tax_paid: "100 times jaffle-shop's: it sums TAX_PAID (L3638), which holds cents because of the staging swap at L612 (decision D1)."

  orders:
    key: [order_id]
    rows:
      only_reference: 483
      reason: "The 483 orders with no items. JNR_ORDERS_ITEMS_AGG (L3519) is a Master Outer Join: it keeps every per-order item total (detail) and drops orders with no match (decision D1)."
    rename: {ordered_at_day: ordered_at, has_food_items: is_food_order, has_drink_items: is_drink_order}
    explained:
      subtotal: "100 times too small: SUBTOTAL_RECAL = SUBTOTAL_CENTS/100 (L3534), but stg_orders.subtotal_cents holds dollars because of the swap at L608 (decision D1)."
      tax_paid: "100 times too small and without its cents: TAX_PAID_RECAL = TAX_PAID_CENTS/100 (L3535) divides whole dollars (swap at L609, rounded by NUMBER(15,0) in staging)."
      order_total: "100 times too small: ORDER_TOTAL_RECAL = ORDER_TOTAL_CENTS/100 (L3536) divides dollars (swap at L610); the NUMBER(12,2) column then rounds it to 2 places (L3785, decision Q11)."
      order_items_subtotal: "100 times jaffle-shop's: it sums PRODUCT_PRICE (L3459), which holds cents because of the staging swap at L621 (decision D1)."
      customer_order_number: "Never restarts per customer: the counter (L3588-3589) numbers all 61,465 rows 1 to 61,465 by customer, day and order (decision Q13); it equals jaffle-shop's per-customer number only on the 190 rows of the first customer in that order, who has 190 orders numbered 1 to 190."
    not_compared:
      reference:
        subtotal_cents: "jaffle-shop passes the staging cents columns through; the XML's ORDERS has none."
        tax_paid_cents: "jaffle-shop passes the staging cents columns through; the XML's ORDERS has none."
        order_total_cents: "jaffle-shop passes the staging cents columns through; the XML's ORDERS has none."
        count_food_items: "jaffle-shop counts items; the XML's ORDERS keeps only the 1/0 flags."
        count_drink_items: "jaffle-shop counts items; the XML's ORDERS keeps only the 1/0 flags."
        count_order_items: "jaffle-shop counts items; ITEMS_COUNT (L3458) is not connected to ORDERS."

  order_items:
    key: [order_item_id]
    rename: {ordered_at_day: ordered_at, supply_cost_per_product: supply_cost}
    explained:
      product_price: "100 times jaffle-shop's: it comes from stg_products.product_price, which holds cents because of the swap at L621 (decision D1)."
    not_compared:
      ours:
        product_type: "jaffle-shop's order_items has no product type."
        has_perishable_supply: "jaffle-shop's order_items has no perishable flag."

  products:
    key: [product_id]
    explained:
      product_price: "Swap at L621, passed through from staging: holds cents (decision D1)."
    not_compared:
      ours:
        product_price_cents: "Swap at L620, passed through: holds dollars rounded to whole dollars; jaffle-shop has no cents column."

  supplies:
    key: [supply_id, product_id]   # supply_id alone repeats
    rename: {is_perishable: is_perishable_supply}
    explained:
      is_perishable: "Passed through from staging: the rule at L504 never matches the seed's True/False (decision Q14), so every supply is 0."
    not_compared:
      ours:
        supply_cost_cents: "jaffle-shop has no cents column."
      reference:
        supply_uuid: "jaffle-shop's surrogate key; the XML has none."

# Enriched marts: no jaffle-shop model of their own. Only columns that repeat a jaffle-shop mart column are
# compared (check 3); everything else is checked by the seed facts in tests/test_reference_enriched.py.
enriched:
  order_financials:
    reference_table: orders
    key: [order_id]
    rows:
      only_reference: 483
      reason: "The 483 orders with no items: JNR_ORDERS_ITEMS_AGG (L1591) is a Master Outer Join that keeps the per-order item totals and drops orders with no match (decision D1)."
    rename: {ordered_at_day: ordered_at, order_subtotal: subtotal, order_tax_paid: tax_paid, item_lines: count_order_items,
             item_revenue: order_items_subtotal, order_cogs: order_cost, food_item_lines: count_food_items,
             drink_item_lines: count_drink_items}
    explained:
      order_subtotal: "100 times jaffle-shop's: ORDER_SUBTOTAL = SUBTOTAL (L1606), which holds cents because of the staging swap at L611 (decision D1)."
      order_tax_paid: "100 times jaffle-shop's: ORDER_TAX_PAID = TAX_PAID (L1607), which holds cents because of the staging swap at L612 (decision D1)."
      order_total: "100 times jaffle-shop's: ORDER_TOTAL comes from stg_orders.order_total, which holds cents because of the staging swap at L613 (decision D1)."
      item_revenue: "100 times jaffle-shop's: it sums PRODUCT_PRICE (L1555), which holds cents because of the staging swap at L621 (decision D1)."
      customer_order_number: "Never restarts per customer: the counter (L1705-1706) numbers all 61,465 rows by customer, day and order (decision Q13); it equals jaffle-shop's per-customer number only on the 190 rows of the first customer in that order."
    other_columns: "No twin column in jaffle-shop's orders."

  order_item_enriched:
    reference_table: order_items
    key: [order_item_id]
    rename: {ordered_at_day: ordered_at, item_cogs: supply_cost}
    explained:
      product_price: "100 times jaffle-shop's: it comes from stg_products.product_price, which holds cents because of the swap at L621 (decision D1)."
    other_columns: "No twin column in jaffle-shop's order_items."

  customer_360:
    reference_table: customers
    key: [customer_id]
    explained:
      count_lifetime_orders: "Counts only orders with items: JNR_ORDERS_ITEMS_AGG (L1591) drops the 483 orders with no items, which belong to 85 customers; each count is lower by that customer's number of such orders."
      first_ordered_at: "For 5 customers jaffle-shop's first day is a day whose only order had no items, which never reaches this table (L1591)."
      last_ordered_at: "For 5 customers jaffle-shop's last day is a day whose only order had no items, which never reaches this table (L1591)."
      lifetime_spend_pretax: "Holds LIFETIME_SPEND, the sum of order totals in cents (crossed at L2480; cents from the staging swap at L613)."
      lifetime_tax_paid: "Holds LIFETIME_SPEND_PRETAX, the sum of subtotals in cents (crossed at L2481; cents from the staging swap at L611)."
      lifetime_spend: "Holds LIFETIME_TAX_PAID, the sum of tax in cents (crossed at L2482; cents from the staging swap at L612)."
    other_columns: "No twin column in jaffle-shop's customers."
